<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Documents Overview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f6fa;
      color: #333;
      padding: 40px 24px;
    }
    header {
      max-width: 900px;
      margin: 0 auto 36px;
      border-bottom: 2px solid #dde1ea;
      padding-bottom: 16px;
    }
    header h1 { font-size: 1.8rem; color: #1a1a2e; }
    header p  { margin-top: 6px; color: #666; font-size: 0.95rem; }
    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #dde1ea;
      padding: 20px 24px;
    }
    .card h2 {
      font-size: 1.05rem;
      color: #1a1a2e;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .category { margin-bottom: 14px; }
    .category h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin-bottom: 6px;
    }
    .category ul { list-style: none; padding-left: 4px; }
    .category ul li { padding: 3px 0; }
    .category ul li a {
      color: #3a6fd8;
      text-decoration: none;
      font-size: 0.92rem;
    }
    .category ul li a:hover { text-decoration: underline; }
    .empty { color: #bbb; font-size: 0.88rem; font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>IT Documents Overview</h1>
  <p>系統文件總覽，點選連結開啟對應文件。</p>
</header>

<div class="grid">

  <!-- MSU Scorecard -->
  <div class="card">
    <h2>MSU Scorecard</h2>
    <div class="category">
      <h3>需求與規格</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
    <div class="category">
      <h3>功能模組</h3>
      <ul>
        <li><a href="msu-scorecard/功能模組/SP重構說明文件.html">SP 重構說明文件</a></li>
      </ul>
    </div>
  </div>

  <!-- OSF Commerce Insights -->
  <div class="card">
    <h2>OSF Commerce Insights</h2>
    <div class="category">
      <h3>需求與規格</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
    <div class="category">
      <h3>功能模組</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
  </div>

  <!-- TCP -->
  <div class="card">
    <h2>TCP 改版</h2>
    <div class="category">
      <h3>需求與規格</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
    <div class="category">
      <h3>功能開發</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
    <div class="category">
      <h3>DB 變更記錄</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
  </div>

  <!-- eManagerReport -->
  <div class="card">
    <h2>eManagerReport</h2>
    <div class="category">
      <h3>需求與規格</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
    <div class="category">
      <h3>功能模組</h3>
      <ul>
        <li class="empty">尚無文件</li>
      </ul>
    </div>
  </div>

</div>
</body>
</html>
